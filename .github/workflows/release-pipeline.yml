name: Build Release APK and Update Website

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
              echo "::error::Release signing secrets are required for APK releases to remain update-compatible."
              exit 1
            fi
          fi
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            printf "storeFile=release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD" > keystore.properties
          fi
        shell: bash

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_FIREBASE_APPLICATION_ID: ${{ vars.FIREBASE_APPLICATION_ID || secrets.FIREBASE_APPLICATION_ID }}
          ORG_GRADLE_PROJECT_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }}
          ORG_GRADLE_PROJECT_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
          ORG_GRADLE_PROJECT_FIREBASE_GCM_SENDER_ID: ${{ vars.FIREBASE_GCM_SENDER_ID || secrets.FIREBASE_GCM_SENDER_ID }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Prepare release metadata and update website/release.json
        id: metadata
        run: python3 .github/scripts/prepare-release-metadata.py
        shell: bash

      - name: Upload APK to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.release.tag_name }}
          name: ${{ steps.metadata.outputs.apk_file_name }}
          files: ${{ steps.metadata.outputs.apk_release_asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit website/release.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/release.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update website release metadata for ${{ steps.metadata.outputs.version_name }}"
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi
        shell: bash

      - name: Upload release.json as artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: release-json
          path: website/release.json
