name: Build Release APK and Update Website

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to build and publish, for example v1.1.2
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          if [ "${{ github.event_name }}" = "release" ] || [ -n "${{ inputs.release_tag }}" ]; then
            if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ] || [ -z "$RELEASE_CERT_SHA256" ]; then
              echo "::error::Release signing secrets are required for APK releases to remain update-compatible."
              exit 1
            fi
          fi
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            printf "storeFile=../release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD" > keystore.properties
          fi
        shell: bash

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_FIREBASE_APPLICATION_ID: ${{ vars.FIREBASE_APPLICATION_ID || secrets.FIREBASE_APPLICATION_ID }}
          ORG_GRADLE_PROJECT_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY || secrets.FIREBASE_API_KEY }}
          ORG_GRADLE_PROJECT_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
          ORG_GRADLE_PROJECT_FIREBASE_GCM_SENDER_ID: ${{ vars.FIREBASE_GCM_SENDER_ID || secrets.FIREBASE_GCM_SENDER_ID }}
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_FIREBASE_APPLICATION_ID" ] || [ -z "$ORG_GRADLE_PROJECT_FIREBASE_API_KEY" ] || [ -z "$ORG_GRADLE_PROJECT_FIREBASE_PROJECT_ID" ] || [ -z "$ORG_GRADLE_PROJECT_FIREBASE_GCM_SENDER_ID" ]; then
            echo "::error::Firebase Android configuration is required so release APKs can receive standby push notifications."
            exit 1
          fi
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Verify release certificate
        env:
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$APK_FILE" ] || [ -z "$APKSIGNER" ]; then
            echo "::error::Release APK or apksigner was not found."
            exit 1
          fi
          ACTUAL_CERT=$($APKSIGNER verify --print-certs "$APK_FILE" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          EXPECTED_CERT=$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::Release certificate mismatch. Expected $EXPECTED_CERT but built $ACTUAL_CERT."
            exit 1
          fi
          echo "Release certificate verified: $ACTUAL_CERT"
        shell: bash

      - name: Prepare release metadata and update website/release.json
        id: metadata
        env:
          RELEASE_TAG_OVERRIDE: ${{ inputs.release_tag }}
        run: python3 .github/scripts/prepare-release-metadata.py
        shell: bash

      - name: Upload APK to GitHub release
        if: github.event_name == 'release' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: ${{ steps.metadata.outputs.apk_release_asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit website/release.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/release.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update website release metadata for ${{ steps.metadata.outputs.version_name }}"
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi
        shell: bash

      - name: Upload release.json as artifact for review
        uses: actions/upload-artifact@v7
        with:
          name: release-json
          path: website/release.json
